#version: "3" #this gives obsolete warning
services:
  db:
    build: ./pg-vec-geo
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5436:5432"
    volumes:
      - ./pg-data/pg-data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4:9.8
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: docker@va-tu.at
      PGADMIN_DEFAULT_PASSWORD: postgres
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "10005:80"
    volumes:
      - ./servers.json:/pgadmin4/servers.json # preconfigured servers/connections
      - ./pgpass:/pgpass # passwords for the connections in this file
      # - ./pg-admin-data:/var/lib/pgadmin
    links:
      - "db:pgsql-server"
  puppygraph:
    image: puppygraph/puppygraph:stable
    pull_policy: always
    container_name: puppygraph
    environment:
      - PUPPYGRAPH_USERNAME=puppygraph
      - PUPPYGRAPH_PASSWORD=puppygraph123
      - STORAGE_PATH_ROOT=/data/storage
      # - PUPPYGRAPH_ENABLE_CORSES=true
      # - PUPPYGRAPH_CORS_ALLOWED_ORIGINS=http://localhost:5173
      # - PUPPYGRAPH_ENABLE_CORS=true
      # - PUPPYGRAPH_CORS_ALLOWED_ORIGINS=http://127.0.0.1:5173
      # - PUPPYGRAPH_CORS_ALLOWED_METHODS=GET,POST,PATCH,DELETE,OPTIONS
      # - PUPPYGRAPH_CORS_ALLOWED_HEADERS=Content-Type,Authorization
    ports:
      - "8081:8081"
      - "8182:8182"
      - "7687:7687"
    volumes:
      - ./puppygraph-data:/data
volumes:
  pg-data:
    external: false
